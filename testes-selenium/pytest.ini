[pytest]
testpaths = testes
pythonpath = .
addopts = -v --html=relatorios/relatorio.html --self-contained-html --junitxml=relatorios/junit.xml
markers =
    positivo: ação ou entrada válida deve ser aceita
    negativo: ação ou entrada inválida deve ser recusada
    tabela_decisao: resultado depende da combinação de condições
    transicao_estado: comportamento depende do estado atual (sessão, bloqueio)
    valor_limite: verifica a fronteira onde o comportamento muda
    particionamento: usa um representante de uma classe de equivalência
