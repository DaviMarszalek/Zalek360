# Zalek360 — ambiente completo (PostgreSQL + API ASP.NET Core + Web Next.js)
#   docker compose up --build
#   Frontend  http://localhost:3000   ·   API  http://localhost:5000   ·   Swagger  http://localhost:5000/swagger
# Os valores padrão abaixo servem para demonstração local. Para qualquer outro uso, copie .env.example para .env
# e troque senha do banco e chave JWT.
name: zalek360

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zalek360}
      POSTGRES_USER: ${POSTGRES_USER:-zalek360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zalek360}
    ports:
      - "${POSTGRES_PORTA_HOST:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: só considera pronto quando aceita TCP (durante o init a imagem escuta apenas por socket).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Zalek360: "Host=db;Port=5432;Database=${POSTGRES_DB:-zalek360};Username=${POSTGRES_USER:-zalek360};Password=${POSTGRES_PASSWORD:-zalek360}"
      Jwt__Chave: ${JWT_CHAVE:-chave-local-docker-zalek360-somente-demonstracao-troque-no-env}
      # HTTP local: o cookie de sessão não pode exigir HTTPS. Atrás de proxy com TLS, use true.
      Autenticacao__CookieSegura: ${COOKIE_SEGURA:-false}
      Aplicacao__FusoHorario: America/Sao_Paulo
      Banco__ExecutarSeed: ${EXECUTAR_SEED:-true}
      Banco__SenhaUsuariosDemo: ${SENHA_USUARIOS_DEMO:-Zalek@2026}
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-true}
    ports:
      - "${BACKEND_PORTA_HOST:-5000}:8080"
    volumes:
      - anexos:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço do backend DENTRO da rede do compose; gravado no build do Next.js.
        API_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORTA_HOST:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dados-postgres:
  anexos:
