# Zalek360 — ambiente completo (PostgreSQL + API ASP.NET Core + Web Next.js)
#   1) copie .env.example para .env e preencha JWT_CHAVE e POSTGRES_PASSWORD (obrigatórios, sem valor padrão);
#   2) docker compose up --build
#   Frontend http://localhost:3000 (rede) · API http://127.0.0.1:5000 (somente este computador)
# Segurança: sem .env os comandos param com mensagem; a API recusa segredos curtos ou publicados.
# Atualização do ambiente principal: docs/11-atualizar-ambiente-principal.md.
name: zalek360

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zalek360}
      POSTGRES_USER: ${POSTGRES_USER:-zalek360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja docs/11-atualizar-ambiente-principal.md)}
    ports:
      - "127.0.0.1:${POSTGRES_PORTA_HOST:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: só considera pronto quando aceita TCP (durante o init a imagem escuta apenas por socket).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Zalek360: "Host=db;Port=5432;Database=${POSTGRES_DB:-zalek360};Username=${POSTGRES_USER:-zalek360};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja docs/11-atualizar-ambiente-principal.md)}"
      Jwt__Chave: ${JWT_CHAVE:?Defina JWT_CHAVE no .env (veja docs/11-atualizar-ambiente-principal.md)}
      # Cookie de sessão com Secure por padrão (HTTPS ou http://localhost). Acesso por http://IP da rede exige
      # HTTPS ou COOKIE_SEGURA=false consciente (docs/11).
      Autenticacao__CookieSegura: ${COOKIE_SEGURA:-true}
      Aplicacao__FusoHorario: America/Sao_Paulo
      Empresa__NomeFantasia: ${Empresa__NomeFantasia:-Zalek Personalizados}
      Empresa__RazaoSocial: ${Empresa__RazaoSocial:-}
      Empresa__Cnpj: ${Empresa__Cnpj:-}
      Empresa__Telefone: ${Empresa__Telefone:-}
      Empresa__WhatsApp: ${Empresa__WhatsApp:-}
      Empresa__Email: ${Empresa__Email:-}
      Empresa__Site: ${Empresa__Site:-}
      Empresa__Endereco: ${Empresa__Endereco:-}
      Empresa__CaminhoLogo: ${Empresa__CaminhoLogo:-}
      Empresa__TextoRodape: ${Empresa__TextoRodape:-}
      Email__Host: ${Email__Host:-}
      Email__Porta: ${Email__Porta:-587}
      Email__Seguranca: ${Email__Seguranca:-StartTls}
      Email__Usuario: ${Email__Usuario:-}
      Email__Senha: ${Email__Senha:-}
      Email__Remetente: ${Email__Remetente:-}
      Email__NomeRemetente: ${Email__NomeRemetente:-Zalek Personalizados}
      Banco__ExecutarSeed: ${EXECUTAR_SEED:-false}
      Banco__SenhaUsuariosDemo: ${SENHA_USUARIOS_DEMO:-}
    ports:
      - "127.0.0.1:${BACKEND_PORTA_HOST:-5000}:8080"
    volumes:
      - anexos:/app/data/uploads
      - identidade:/app/data/empresa:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço do backend DENTRO da rede do compose; gravado no build do Next.js.
        API_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORTA_HOST:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Só é iniciado explicitamente para testes no projeto zalek360-revisao.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    profiles: [teste-email]
    environment:
      ServerOptions__Urls: http://*:80
      ServerOptions__HostName: smtp4dev
      ServerOptions__TlsMode: None
    ports:
      - "127.0.0.1:5180:80"
    restart: unless-stopped

volumes:
  dados-postgres:
  anexos:
  identidade:
