# Exemplo de proxy reverso para publicar o Zalek360 com HTTPS (ambiente interno da Zalek Personalizados).
# Todo o tráfego vai para o frontend; o próprio Next.js encaminha /api/* ao backend, então o cookie de sessão
# fica no mesmo domínio. Com TLS ativo, defina COOKIE_SEGURA=true no .env do docker-compose.
#
# Ajuste server_name e os caminhos dos certificados. Para usar a partir de um container nginx na mesma rede do
# compose, troque 127.0.0.1:3000 por frontend:3000 e 127.0.0.1:5000 por backend:8080.

server {
    listen 80;
    server_name zalek360.exemplo.interno;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zalek360.exemplo.interno;

    ssl_certificate     /etc/nginx/certs/zalek360.crt;
    ssl_certificate_key /etc/nginx/certs/zalek360.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Artes anexadas aos itens: até 20 MB por arquivo (+ margem do multipart).
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Opcional: documentação da API. Remova para não expor o Swagger (ou desative com SWAGGER_HABILITADO=false).
    location /swagger {
        proxy_pass http://127.0.0.1:5000;
    }
}
